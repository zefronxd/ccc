cplay_1 : "❖ நீங்கள் {0} இலிருந்து எந்த சேனலுக்கும் அல்லது உங்கள் அரட்டையின் இணைக்கப்பட்ட சேனலுக்கும் இசையை வாசிக்க முடியும்.\n\n<b>இணைக்கப்பட்ட சேனலுக்கு:</b>\n<code>/channelplay linked</code>\n\n<b>வேறு எந்த சேனலுக்கும்:</b>\n<code>/channelplay [சேனல் ஐடி]</code>"

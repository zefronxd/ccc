start_2 : "**✦ வணக்கம் {0} உங்களை சந்தித்ததில் மகிழ்ச்சி 🥀**\n\n**⊚ இது {1}\n\n➻ தொலைநகல் குழுக்கள் & சேனல்களுக்கான பிரீமியம் வடிவமைக்கப்பட்ட இசை ப்ளேயர் போட்.**\n\n**» ஏதேனும் உதவி தேவைப்பட்டால் உதவி பொத்தானை அழுத்தவும்.**\n\n**•── ⋅ ⋅  ────── ⋅᯽⋅ ────── ⋅ ⋅ ⋅──•**"
start_3 : "❖ ஹே {0},\n»இது {1}\n\n» {2} இல் என்னை சேர்த்ததற்கு நன்றி, {3} இப்போது இந்த அரட்டையில் பாடல்களை வாசிக்க முடியும்."
start_4 : "侖 <b>சூப்பர் குழு தேவை</b> 侖\n\nதயவு செய்து உங்கள் <b>குழுவை</b> <b>சூப்பர் குழுவாக</b> மாற்றி பின்னர் மீண்டும் என்னை சேர்க்கவும்.\n\n<b>சூப்பர் குழுவை உருவாக்குவது எப்படி?</b>\n- உங்கள் குழுவின் அரட்டை வரலாற்றை <b>காணக்கூடியதாக</b> ஆக்கவும்."
start_5 : "❖ <b>↝ பிளாக்லிஸ்ட் செய்யப்பட்ட அரட்டை ↜</b>\n\nஇந்த அரட்டை {0} டேட்டாபேஸில் பிளாக்லிஸ்ட் செய்யப்பட்டுள்ளது.\nஉங்கள் அரட்டையை அன்பிளாக் செய்ய <a href={1}>சூடோ பயனர்</a> ஐ கோரவும் அல்லது <a href={2}>ஆதரவு அரட்டை</a> ஐ பார்வையிடவும்."
start_6 : "侖 <b>பாடல் தகவல்</b> 侖\n\n侖 <b>தலைப்பு :</b> {0}\n\n侖 <b>நேரம் :</b> {1} நிமிடங்கள்\n侖 <b>பார்வைகள் :</b> <code>{2}</code>\n侖 <b>வெளியிடப்பட்ட தேதி :</b> {3}\n侖 <b>சேனல் :</b> <a href={4}>{5}</a>\n\n<u><b>☉ தேடல் சக்தி {6}</b></u>"

help_1 : "**❖ உதவி பெற வகையை தேர்ந்தெடுக்கவும்**\n\n**» உங்கள் சந்தேகங்களை <a href={0}>ஆதரவு அரட்டை</a> இல் கேளுங்கள்**\n\n**» அனைத்து கட்டளைகளும் பயன்படுத்தப்படலாம் :** <code>/</code>"
help_2 : "**❖ உங்கள் PM இல் எனது உதவி மெனுவைப் பெற கீழே உள்ள பொத்தானைக் கிளிக் செய்யவும்**"

lang_1 : "❖ இந்த குழுவின் இயல்புநிலை மொழியாக அமைக்க விரும்பும் மொழியைத் தேர்ந்தெடுக்கவும்:"
lang_2 : "❖ மொழி வெற்றிகரமாக மாற்றப்பட்டது."
lang_3 : "❖ மொழியை மாற்ற முடியவில்லை."
lang_4 : "❖ நீங்கள் ஏற்கனவே அதே மொழியில் இருக்கிறீர்கள்."

setting_1 : "❖ <u><b>{0} அமைப்புகள் பேனல்</b></u>\n\n<b>அரட்டை ஐடி :</b> <code>{1}</code>\n<b>அரட்டை தலைப்பு :</b> {2}\n\nஅமைப்புகளை மாற்ற கீழே உள்ள பொத்தான்களைக் கிளிக் செய்யவும்."
setting_2 : "❖ நேரடி : தேடல் கோரிக்கைகளை நேரடியாக வாசிக்கிறது.\n\n❖ இன்லைன் : வீடியோ மற்றும் ஆடியோக்களுக்கிடையே தேர்வு செய்ய இன்லைன் பொத்தான்களை வழங்குகிறது."
setting_3 : "❖ அனைவரும் : இந்த குழுவில் உள்ள யாரும் நிர்வாகி கட்டளைகளைப் பயன்படுத்தலாம் [தவிர், இடைநிறுத்து, தொடர் போன்றவை].\n\n❖ நிர்வாகிகள் மட்டும் : நிர்வாகிகள் மற்றும் அங்கீகரிக்கப்பட்ட பயனர்கள் மட்டுமே நிர்வாகி கட்டளைகளைப் பயன்படுத்த முடியும்."
setting_4 : "❖ அங்கீகரிக்கப்பட்ட பயனர்கள் எவரும் கிடைக்கவில்லை."
setting_5 : "❖ குழு : கட்டளை கொடுக்கப்பட்ட குழுவில் இசையை வாசிக்கிறது.\n\n❖ சேனல் : நீங்கள் விரும்பும் சேனலில் இசையை வாசிக்கிறது. சேனல் ஐடி /channelplay மூலம் அமைக்கவும்"
setting_6 : "❖ அனைவரும் : இந்த குழுவில் உள்ள யாரும் இங்கே இசையை வாசிக்க முடியும்.\n\n❖ நிர்வாகிகள் மட்டும்: நிர்வாகிகள் மட்டுமே இந்த குழுவில் இசையை வாசிக்க முடியும்."
setting_7 : "❖ தயவு செய்து /channelplay மூலம் சேனல் ஐடி வரையறுக்கவும்"
setting_8 : "❖ இந்த முறை இயக்கப்பட்டால், நிர்வாகி உரிமைகள் இல்லாத நபர்கள் ஒரு குறிப்பிட்ட அளவு வாக்குகளுக்குப் பிறகு நிர்வாகி கட்டளைகளைப் பயன்படுத்தலாம்."
setting_9 : "❖ நிர்வாகி கட்டளைகளைப் பயன்படுத்த தற்போது தேவைப்படும் வாக்குகள்: {0}"
setting_10 : "❖ வாக்கெடுப்பு முறை முடக்கப்பட்டுள்ளது."
setting_11 : "❖ குறைந்தபட்ச வாக்கு எண்ணிக்கை 2 ஆக இருக்க முடியும். 2 க்குக் கீழே அமைக்க முடியாது"

cplay_4 : "❖ சேனலைப் பெற முடியவில்லை.\n\nபோட் உங்கள் சேனலில் சேர்க்கப்பட்டு நிர்வாகியாக பதவி உயர்வு பெற்றுள்ளது என்பதை உறுதிப்படுத்தவும்."
cplay_5 : "❖ சேனல்கள் மட்டுமே ஆதரிக்கப்படுகின்றன."
cplay_6 : "❖ சேனல் {0} உடன் இந்த குழுவை இணைக்க நீங்கள் சேனலின் <b>உரிமையாளர்</b> ஆக இருக்க வேண்டும்.\n<b>சேனலின் உரிமையாளர்:</b> @{1}\n\nமாற்றாக, உங்கள் குழுவை அந்த சேனலுடன் இணைத்து <code>/channelplay linked</code> மூலம் இணைக்க முயற்சிக்கவும்"
cplay_7 : "❖ சேனல் ப்ளே முடக்கப்பட்டது."


services:
  - type: worker
    name: purvi-music-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m ZEFRONMUSIC
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BOT_NAME
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: STRING_SESSION2
        sync: false
      - key: STRING_SESSION3
        sync: false
      - key: STRING_SESSION4
        sync: false
      - key: STRING_SESSION5
        sync: false
